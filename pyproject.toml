[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "novoweave"
version = "0.1.0"
description = "A conceptual generative protein-design framework and software blueprint"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zekun Cheng" }]
keywords = ["protein-design", "deep-learning", "pseudocode", "research-software"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
novoweave = "novoweave.cli:app"

[project.urls]
Documentation = "https://github.com/ZekunCheng/novoweave/tree/main/docs"
Issues = "https://github.com/ZekunCheng/novoweave/issues"
Source = "https://github.com/ZekunCheng/novoweave"

[tool.hatch.build.targets.wheel]
packages = ["src/novoweave"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["conceptual: contract test for non-functional pseudocode"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["novoweave"]
